# Builds the book on every push to main, checks it, and publishes the site.
#
# Setup (once), for a private or public repository holding this source:
#   1. Create an SSH key pair:        ssh-keygen -t ed25519 -f deploy_key -N ""
#   2. In the *site* repository (the empty public repo the built HTML is pushed to):
#      Settings > Deploy keys > Add deploy key, paste deploy_key.pub, allow write access.
#   3. In this repository: Settings > Secrets and variables > Actions >
#      New repository secret DEPLOY_KEY, paste the private key (deploy_key), and
#      repository variables SITE_REPO (e.g. USER/my-book) and, optionally,
#      SITE_DOMAIN (the custom domain, written into CNAME).
# Until DEPLOY_KEY and SITE_REPO exist the publish step is skipped, so the workflow
# builds and checks a fresh book without any setup at all.
# Pull requests are built and checked but not published.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live, poppler, aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-pictures texlive-fonts-extra \
            poppler-utils aspell aspell-en

      - name: Install Pandoc 3.1.3
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i pandoc.deb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache MathJax
        uses: actions/cache@v4
        with:
          path: ~/.cache/book-engine
          key: book-engine-mathjax-3.2.2

      - name: Check tools
        run: ./build.py doctor

      - name: Engine tests
        run: python -m unittest discover -s tests

      - name: Build website and PDFs
        run: ./build.py all

      - name: Check references, links, numbering
        run: ./build.py check

      - name: Publish to the site repository
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
          && secrets.DEPLOY_KEY != '' && vars.SITE_REPO != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ${{ vars.SITE_REPO }}
          publish_branch: main
          publish_dir: ./_build/html
          cname: ${{ vars.SITE_DOMAIN }}
          commit_message: Deploy
